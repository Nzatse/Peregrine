name: Build

# Proves Peregrine compiles and bundles on both Windows and macOS.
# Runs on version tags and on manual dispatch. Produces unsigned installers as
# artifacts (signing needs your own certs — see docs/DISTRIBUTION.md).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # whisper.cpp needs cmake; the vendored OpenSSL (SQLCipher) needs NASM on
      # Windows. Perl (Strawberry) and cmake are preinstalled on the runners.
      - name: Install NASM (Windows)
        if: runner.os == 'Windows'
        run: choco install nasm -y

      - name: Ensure cmake (macOS)
        if: runner.os == 'macOS'
        run: brew list cmake >/dev/null 2>&1 || brew install cmake

      - name: Install dependencies
        run: npm ci

      - name: Build app
        run: npm run tauri build

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: peregrine-${{ matrix.os }}
          path: |
            src-tauri/target/release/bundle/**
          if-no-files-found: warn

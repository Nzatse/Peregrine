[package]
name = "peregrine"
version = "0.1.0"
description = "A local-first AI coworker that builds your career memory from real work. Part of the Aerie suite."
authors = ["Nzatse"]
license = "AGPL-3.0-only"
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "peregrine_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
# Signed in-app updates from GitHub Releases. Desktop-only: the updater has no
# mobile implementation, so keep it behind the target gate below.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rusqlite = { version = "0.32", features = ["bundled-sqlcipher-vendored-openssl"] }
uuid = { version = "1", features = ["v4"] }
cpal = "0.15"
whisper-rs = "0.12"
ruhear = "0.1"
base64 = "0.22"
pdf-extract = "0.7"
zip = "2"

# No OS keychain: secrets (the API key) live encrypted inside the vault,
# protected by the user's passphrase. Nothing is stored in an OS credential store.

# Desktop-only plugins.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"  # relaunch after an update installs

# ruhear 0.1.1 (system-audio "capture all") calls SCContentFilter::builder(), which
# was removed in screencapturekit 1.5. Pin the transitive dep to 1.4.x so it keeps
# compiling. macOS-only — the other platforms use cpal loopback, no SCK involved.
[target.'cfg(target_os = "macos")'.dependencies]
screencapturekit = "=1.4.0"
